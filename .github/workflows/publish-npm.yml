name: Publish npm

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 公開する既存の注釈付きタグ（例 v0.19.6）
        required: true
        type: string
      candidate-run-id:
        description: 受入済み Pack release candidate の run ID
        required: true
        type: string
      archive-sha256:
        description: オーナー許可の対象にした archive の完全SHA256
        required: true
        type: string

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: npm-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Node and npm registry
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24.22.1"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Verify tagged release commit
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          node scripts/ci-toolchain.mjs hosted
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          release_ref="refs/caveat-release/$RELEASE_TAG"
          git fetch origin "refs/heads/main:refs/remotes/origin/main" "refs/tags/$RELEASE_TAG:$release_ref"
          test "$(git cat-file -t "$release_ref")" = tag
          release_commit=$(git rev-parse --verify "$release_ref^{commit}")
          git checkout --detach "$release_commit"
          version=$(node -p "require('./apps/cli/package.json').version")
          test "$RELEASE_TAG" = "v$version"
          node scripts/verify-release-commit.mjs
      - name: Download and verify the accepted archive
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate-run-id }}
          ACCEPTED_ARCHIVE_SHA256: ${{ inputs.archive-sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$ACCEPTED_ARCHIVE_SHA256" =~ ^[a-f0-9]{64}$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID" > "$RUNNER_TEMP/candidate-run.json"
          export CANDIDATE_RUN_ATTEMPT="$(node -p "require('$RUNNER_TEMP/candidate-run.json').run_attempt")"
          node scripts/release-artifact.mjs check-run "$RUNNER_TEMP/candidate-run.json"
          gh run download "$CANDIDATE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name caveat-release-pack --dir "$RUNNER_TEMP/candidate"
          archive=$(node scripts/release-artifact.mjs verify "$RUNNER_TEMP/candidate" "$RUNNER_TEMP/candidate-run.json")
          printf 'RELEASE_ARCHIVE=%s\n' "$archive" >> "$GITHUB_ENV"
      - name: Install pinned publishing npm
        shell: bash
        run: |
          npm install -g npm@11.19.1
      - name: Publish the accepted archive with npm OIDC
        shell: bash
        run: |
          npm publish "$RELEASE_ARCHIVE" --access public
