name: Publish npm

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: 公開する既存の注釈付きタグ（例 v0.19.6）
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Node and npm registry
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Verify tagged release commit
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          release_ref="refs/caveat-release/$RELEASE_TAG"
          git fetch origin "refs/heads/main:refs/remotes/origin/main" "refs/tags/$RELEASE_TAG:$release_ref"
          test "$(git cat-file -t "$release_ref")" = tag
          release_commit=$(git rev-parse --verify "$release_ref^{commit}")
          git checkout --detach "$release_commit"
          version=$(node -p "require('./apps/cli/package.json').version")
          test "$RELEASE_TAG" = "v$version"
          node scripts/verify-release-commit.mjs
          printf 'RELEASE_VERSION=%s\n' "$version" >> "$GITHUB_ENV"
      - name: Install pinned npm and workspace dependencies
        shell: bash
        run: |
          npm install -g npm@11.19.1
          corepack pnpm install --frozen-lockfile
      - name: Build and verify publish payload
        shell: bash
        run: |
          corepack pnpm -r build
          corepack pnpm check:docs
          corepack pnpm check:npm-pack
      - name: Publish packed CLI with npm OIDC
        shell: bash
        run: |
          cd apps/cli
          corepack pnpm pack --pack-destination "$RUNNER_TEMP"
          npm publish "$RUNNER_TEMP/caveat-cli-$RELEASE_VERSION.tgz" --access public
